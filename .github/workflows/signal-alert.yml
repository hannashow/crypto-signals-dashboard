name: 加密貨幣訊號提醒

on:
  schedule:
    # cron 使用 UTC,台灣為 UTC+8。
    # UTC 00:00-15:00 = 台灣 08:00-23:00,夜間不打擾。
    # 每小時的第 5 分鐘執行(避開整點尖峰,排程較準時)。
    - cron: "5 0-15 * * *"
  workflow_dispatch:  # 也可在 Actions 頁面手動觸發測試

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝依賴
        run: pip install ccxt pandas ta requests

      # 用 cache 保存上次通知過的訊號狀態,避免同一訊號重複通知。
      # 每次執行寫入新的 cache key,restore-keys 以前綴比對取回最近一次的狀態。
      - name: 還原訊號狀態
        uses: actions/cache@v4
        with:
          path: .alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: 檢查訊號並通知
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python check_signals.py
