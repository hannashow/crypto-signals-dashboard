name: 診斷交易所可存取性

# 暫時性 workflow,只供手動觸發,用來確認雲端 IP 能連上哪些交易所。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ccxt
      - run: python _probe_exchanges.py
